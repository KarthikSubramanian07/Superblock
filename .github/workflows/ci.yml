name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: UI lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superblock-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: superblock-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high || true

  mockagent-deps:
    name: Mockagent install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mockagent/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high || true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LA_Hacks/backend_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        env:
          DEMO_MODE: "true"
        run: python -m pytest tests/ -q
